spring:
  application:
    name: vantage-backend
  threads:
    virtual:
      enabled: true
  datasource:
    primary:
      url: jdbc:postgresql://localhost:15432/vantage_primary
      username: vantage
      password: vantage_pw
      hikari:
        maximum-pool-size: 20
        minimum-idle: 0
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000
    replica:
      url: jdbc:postgresql://localhost:15432/vantage_replica
      username: vantage
      password: vantage_pw
      hikari:
        maximum-pool-size: 20
        minimum-idle: 0
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000

logging:
  level:
    org.springframework.security: TRACE
    com.vantage: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317/v1/traces

resilience4j:
  bulkhead:
    instances:
      payment:
        maxConcurrentCalls: 5
        maxWaitDuration: 0ms
  ratelimiter:
    instances:
      geocoding:
        limitForPeriod: 1
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

# ---------------------------------------------------------------------------
# AI support chat configuration
# ---------------------------------------------------------------------------
# Provider: "openapi" for real OpenAI API calls, "stub" for the canned
# fallback (no API key required — used in dev/test environments).
# ---------------------------------------------------------------------------
vantage:
  ai:
    provider: ${VANTAGE_AI_PROVIDER:stub}
    max-tokens-per-tenant: ${VANTAGE_AI_MAX_TOKENS:40000}
    max-requests-per-tenant: ${VANTAGE_AI_MAX_REQUESTS:100}
    openai:
      api-key: ${VANTAGE_AI_OPENAI_API_KEY:}
      base-url: ${VANTAGE_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      model: ${VANTAGE_AI_OPENAI_MODEL:gpt-4o-mini}

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        generate_statistics: true

---
spring:
  config:
    activate:
      on-profile: smoke-test
  datasource:
    primary:
      url: jdbc:postgresql://localhost:15432/vantage_primary
      username: vantage
      password: vantage_pw
    replica:
      url: jdbc:postgresql://localhost:15432/vantage_replica
      username: vantage
      password: vantage_pw
