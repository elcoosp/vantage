spring:
  application:
    name: vantage-backend
  threads:
    virtual:
      enabled: true
  datasource:
    primary:
      url: jdbc:postgresql://localhost:5432/vantage_primary
      username: vantage
      password: vantage_pw
      hikari:
        maximum-pool-size: 20
        minimum-idle: 0
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000
    replica:
      url: jdbc:postgresql://localhost:5432/vantage_replica
      username: vantage
      password: vantage_pw
      hikari:
        maximum-pool-size: 20
        minimum-idle: 0
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000

logging:
  level:
    org.springframework.security: TRACE
    com.vantage: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4317/v1/traces
---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        generate_statistics: true
