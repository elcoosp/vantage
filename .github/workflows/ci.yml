name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  openapi-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Generate Backend OpenAPI models
        run: |
          cd backend
          ./gradlew generateOpenApiModels
      - name: Generate Frontend API client
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run generate:api
      - name: Check for uncommitted changes
        run: |
          # Check for changes outside of generated directories
          CHANGES=$(git status --porcelain | grep -vE "^.. (backend/src/generated/|frontend/src/api/generated/)" || true)
          if [ -n "$CHANGES" ]; then
            echo "Uncommitted changes detected outside generated directories:"
            echo "$CHANGES"
            exit 1
          fi
          echo "No uncommitted changes outside generated directories"
      - name: Compile Backend generated code
        run: |
          cd backend
          ./gradlew compileJava
      - name: Build Frontend
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run unit tests
        run: |
          cd backend
          ./gradlew test --console=plain