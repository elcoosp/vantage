name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  openapi-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Backend OpenAPI models
        run: |
          cd backend
          ./gradlew generateOpenApiModels
      - name: Generate Frontend API client
        run: |
          cd frontend
          npm ci
          npm run generate:api
      - name: Check for uncommitted changes
      - name: Compile Backend generated code
        run: |
          cd backend
          ./gradlew compileJava
      - name: Build Frontend
        run: |
          cd frontend
          npm run build