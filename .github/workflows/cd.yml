name: CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build --no-cache --pull --build-arg BUILD_COMMIT=$(git rev-parse HEAD) -t vantage-backend:latest -f backend/Dockerfile .

      - name: Verify guava version in JAR
        run: |
          docker run --rm --entrypoint sh vantage-backend:latest -c "unzip -l /app/app.jar | grep guava" || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vantage-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
